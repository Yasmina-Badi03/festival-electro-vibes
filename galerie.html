<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Galerie</title>
<style>
.galerie { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.galerie div { background: #2A1A52; color: #fff; padding: 40px; text-align: center; }
</style>
</head>
<body>
<h1>Galerie photo</h1>
<div class="galerie">
<div>Photo 1</div>
<div>Photo 2</div>
<div>Photo 3</div>
<div>Photo 4</div>
<div>Photo 5</div>
<div>Photo 6</div>
</div>
</body>
</html>
